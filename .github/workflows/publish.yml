name: publish
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      check:
        description: connection test only (1)
        default: "0"
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 publish.py
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          CHECK: ${{ inputs.check }}
