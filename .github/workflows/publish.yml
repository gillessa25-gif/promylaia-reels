name: publish
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      check:
        description: connection test only (1)
        default: "0"
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Composio CLI
        run: |
          curl -fsSL https://composio.dev/install | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.composio:$PATH"
          composio login --user-api-key "$COMPOSIO_USER_API_KEY" --org "$COMPOSIO_ORG_ID"
        env:
          COMPOSIO_USER_API_KEY: ${{ secrets.COMPOSIO_USER_API_KEY }}
          COMPOSIO_ORG_ID: ${{ secrets.COMPOSIO_ORG_ID }}
      - run: python3 publish.py
        env:
          CHECK: ${{ inputs.check }}
